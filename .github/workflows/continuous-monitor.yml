name: Complete Intraday Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'
  FUNDAMENTALS_REFRESH_SECONDS: '604800'
  FUNDAMENTALS_REFRESH_PER_CYCLE: '2'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Kolkata'))
          opened=now.replace(hour=9,minute=15,second=0,microsecond=0)
          closed=now.replace(hour=15,minute=30,second=0,microsecond=0)
          market_open=now.weekday()<5 and opened<=now<=closed
          manual=os.getenv('GITHUB_EVENT_NAME')=='workflow_dispatch'
          run_cycle=market_open or manual
          print('IST:',now.isoformat(),'market_open:',market_open,'run_cycle:',run_cycle)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run_cycle={str(run_cycle).lower()}\n')
              f.write(f'market_open={str(market_open).lower()}\n')
          PY

      - name: Record scheduler heartbeat
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
        run: |
          python - <<'PY'
          import json,os,tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('data/scheduler_heartbeat.json');p.parent.mkdir(parents=True,exist_ok=True)
          payload={'state':'RUNNING','message':'24/7 scheduled monitor heartbeat is active','updated_at':datetime.now(ZoneInfo('Asia/Kolkata')).isoformat(),'source':'github-actions-scheduler','workflow_run_id':os.getenv('GITHUB_RUN_ID'),'event':os.getenv('GITHUB_EVENT_NAME'),'market_open':os.getenv('MARKET_OPEN')=='true','scheduled_interval_seconds':300,'paper_mode':True,'live_order_submission':False}
          fd,tmp=tempfile.mkstemp(prefix='scheduler-',suffix='.tmp',dir='data')
          with os.fdopen(fd,'w',encoding='utf-8') as f:json.dump(payload,f,indent=2)
          os.replace(tmp,p)
          PY

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Telegram notification preflight
        continue-on-error: true
        if: steps.market.outputs.run_cycle == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import requests
          d=Path('data');d.mkdir(parents=True,exist_ok=True)
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip();chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          result={'updated_at':datetime.now(ZoneInfo('Asia/Kolkata')).isoformat(),'market_open':os.getenv('MARKET_OPEN')=='true','source':'github-actions-telegram-preflight','workflow_run_id':os.getenv('GITHUB_RUN_ID')}
          try:
              if not token or not chat: raise RuntimeError('Telegram secrets unavailable')
              r=requests.get(f'https://api.telegram.org/bot{token}/getMe',timeout=10);p=r.json()
              if not r.ok or p.get('ok') is not True: raise RuntimeError(f'getMe HTTP {r.status_code}: {p.get("description","unknown error")}')
              text=('🟢 STOCKMARKET BOT — Telegram preflight OK\n'
                    f'Market: {"OPEN" if result["market_open"] else "CLOSED"}\nMode: PAPER\nLive orders: DISABLED\n'
                    f'Time: {result["updated_at"]}')
              r=requests.post(f'https://api.telegram.org/bot{token}/sendMessage',json={'chat_id':chat,'text':text,'disable_web_page_preview':True},timeout=10)
              try:p=r.json()
              except ValueError:p={}
              if not r.ok or p.get('ok') is not True: raise RuntimeError(f'sendMessage HTTP {r.status_code}: {p.get("description","unknown error")}')
              result.update(status='PASSED',message='Telegram authenticated and test message delivered');print('TELEGRAM_PREFLIGHT_PASSED')
          except Exception as exc:
              result.update(status='FAILED',message=str(exc));print('TELEGRAM_PREFLIGHT_FAILED:',str(exc))
          (d/'telegram_preflight_status.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          if result.get('status') != 'PASSED': print('TELEGRAM_WARNING_NON_BLOCKING:',result.get('message','unknown error'))
          PY

      - name: Dhan authentication and market-feed preflight
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from intraday_bot.brokers import DhanBroker
          from intraday_bot.config import settings
          p=Path('data/preflight_status.json');p.parent.mkdir(parents=True,exist_ok=True)
          def write(msg,ok):
              p.write_text(json.dumps({'status':'PASSED' if ok else 'FAILED','message':msg,'updated_at':datetime.now(ZoneInfo('Asia/Kolkata')).isoformat(),'source':'github-actions-dhan-preflight','workflow_run_id':os.getenv('GITHUB_RUN_ID'),'mode':'PAPER','market_open':os.getenv('MARKET_OPEN')=='true','live_order_submission':False},indent=2),encoding='utf-8')
          print('Dhan credential source:',settings.dhan_market_data_credential_source)
          print('Dhan access token configured:',bool(settings.dhan_access_token_value),'length:',len(settings.dhan_access_token_value))
          print('Dhan client configured:',bool(settings.dhan_client_id))
          if not settings.dhan_client_id or not settings.dhan_access_token_configured:
              msg='Dhan requires DHAN_CLIENT_ID and a valid user-generated access token in DHAN_ACCESS_TOKEN; automatic PIN/TOTP/token generation is disabled.';write(msg,False);raise SystemExit('DHAN_PREFLIGHT_ERROR: '+msg)
          try: health=DhanBroker().health()
          except Exception as exc: write(str(exc),False);raise SystemExit('DHAN_PREFLIGHT_ERROR: '+str(exc))
          print('Dhan authentication:',health.message)
          if not health.authenticated: write(health.message,False);raise SystemExit('DHAN_PREFLIGHT_ERROR: '+health.message)
          raw=settings.dhan_security_ids_json.strip()
          if raw:
              try:mapping=json.loads(raw)
              except json.JSONDecodeError: write('Invalid DHAN_SECURITY_IDS_JSON',False);raise SystemExit('DHAN_QUOTE_PREFLIGHT_FAILED: invalid security map')
              instruments=[]
              for symbol,value in mapping.items():
                  item=value if isinstance(value,dict) else {'security_id':value,'exchange_segment':'NSE_EQ'}
                  if item.get('security_id'): instruments.append({'symbol':str(symbol),'security_id':item['security_id'],'exchange_segment':item.get('exchange_segment','NSE_EQ')})
                  if instruments:break
              if instruments:
                  quotes=DhanBroker().bulk_quotes(instruments);print('Dhan market-feed preflight quotes:',len(quotes))
                  if not quotes: write('Market-feed returned zero quotes',False);raise SystemExit('DHAN_QUOTE_PREFLIGHT_FAILED: zero quotes')
          write('Dhan client ID + access token and market-feed preflight passed',True);print('DHAN_PREFLIGHT_PASSED')
          PY

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Verify Dhan quotes against fresh universe
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from intraday_bot.brokers import DhanBroker
          universe=json.loads(Path('data/universe.json').read_text(encoding='utf-8'))
          if not universe: raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: universe empty')
          sample=[x for x in universe if 'NSETEST' not in str(x.get('symbol','')).upper()][:10]
          if not sample: raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: no real symbols')
          quotes=DhanBroker().bulk_quotes(sample);print('Fresh universe symbols:',len(universe),'quote sample:',len(quotes))
          if not quotes: raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: zero quotes')
          print('DHAN_FRESH_UNIVERSE_QUOTE_VERIFY_PASSED')
          PY

      - name: Run complete 5-minute paper cycle
        id: run_cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: '1000'
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
          FUNDAMENTALS_REFRESH_SECONDS: '604800'
          FUNDAMENTALS_REFRESH_PER_CYCLE: '2'
        run: python scripts/run_daily_cycle.py

      - name: Record monitor heartbeat
        if: always()
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
          RUN_CYCLE: ${{ steps.market.outputs.run_cycle }}
          CYCLE_SUCCESS: ${{ steps.run_cycle.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json,os,socket,tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('data/worker_heartbeat.json');p.parent.mkdir(parents=True,exist_ok=True)
          mo=os.getenv('MARKET_OPEN')=='true';ran=os.getenv('RUN_CYCLE')=='true';ok=os.getenv('CYCLE_SUCCESS')=='true'
          state='RUNNING' if mo and ran and ok else ('DEGRADED' if mo and ran else 'HEARTBEAT_ONLY')
          msg='Latest complete paper-trading market cycle succeeded' if state=='RUNNING' else ('Market-cycle invocation failed; inspect preflight_status or cycle logs' if state=='DEGRADED' else '24/7 monitor heartbeat active; NSE market is closed or cycle is not scheduled')
          payload={'state':state,'message':msg,'updated_at':datetime.now(ZoneInfo('Asia/Kolkata')).isoformat(),'source':'github-actions-monitor','hostname':socket.gethostname(),'workflow_run_id':os.getenv('GITHUB_RUN_ID'),'heartbeat_interval_seconds':300,'is_persistent_worker':False,'market_open':mo,'market_cycle':mo and ran,'cycle_success':ok if ran else None,'scheduler_based_monitor':True}
          fd,tmp=tempfile.mkstemp(prefix='worker-',suffix='.tmp',dir='data')
          with os.fdopen(fd,'w',encoding='utf-8') as f:json.dump(payload,f,indent=2)
          os.replace(tmp,p)
          PY

      - name: Persist scheduler and paper state
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then echo 'No state changes.'; exit 0; fi
          git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && echo "State persisted on attempt ${attempt}." && exit 0
            fi
            conflicts=$(git diff --name-only --diff-filter=U || true)
            if [ -z "$conflicts" ]; then
              git rebase --abort || true
              git reset --soft origin/main
              git add data/ reports/
              git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]' || true
              sleep 2
              continue
            fi
            non_state=$(printf '%s\n' "$conflicts" | grep -Ev '^(data/|reports/)' || true)
            if [ -n "$non_state" ]; then
              echo "Unexpected non-state merge conflict:";echo "$non_state";git rebase --abort;exit 1
            fi
            printf '%s\n' "$conflicts" | while IFS= read -r file; do [ -n "$file" ] && git checkout --ours -- "$file"; done
            git add $conflicts
            GIT_EDITOR=true git -c core.editor=true rebase --continue
            if git push origin HEAD:main; then echo "State persisted after state-conflict resolution on attempt ${attempt}."; exit 0; fi
            git rebase --abort || true
            git reset --soft origin/main
            git add data/ reports/
            git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]' || true
            sleep 2
          done
          echo 'Unable to persist state after 5 attempts.'
          exit 1
