name: Complete Intraday Monitor

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  push:
    branches: [main]
    paths:
      - 'intraday_bot/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/continuous-monitor.yml'
      - 'requirements.txt'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          opened = now.replace(hour=9, minute=15, second=0, microsecond=0)
          closed = now.replace(hour=15, minute=30, second=0, microsecond=0)
          weekday = now.weekday() < 5
          in_window = weekday and opened <= now <= closed
          manual = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          run_cycle = in_window or manual
          print('IST:', now.isoformat(), 'market_open:', in_window, 'run_cycle:', run_cycle)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run_cycle={str(run_cycle).lower()}\n')
              f.write(f'market_open={str(in_window).lower()}\n')
          PY

      - name: Record scheduler heartbeat
        shell: bash
        run: |
          python - <<'PY'
          import json, os, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/scheduler_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          market_open = os.getenv('MARKET_OPEN') == 'true'
          payload = {
            'state': 'RUNNING',
            'message': '24/7 scheduled monitor invocation is active',
            'updated_at': now.isoformat(),
            'source': 'github-actions-scheduler',
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'event': os.getenv('GITHUB_EVENT_NAME'),
            'market_open': market_open,
            'scheduled_interval_seconds': 300,
            'paper_mode': True,
            'live_order_submission': False,
          }
          fd, tmp = tempfile.mkstemp(prefix='scheduler-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Run complete 5-minute paper cycle
        id: run_cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: '1000'
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python scripts/run_daily_cycle.py

      - name: Record 24/7 monitor heartbeat
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, socket, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/worker_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          market_open = os.getenv('MARKET_OPEN') == 'true'
          cycle_ran = os.getenv('RUN_CYCLE') == 'true'
          cycle_success = os.getenv('CYCLE_SUCCESS') == 'true'
          if market_open and cycle_ran and cycle_success:
              state = 'RUNNING'
              message = 'Latest complete paper-trading market cycle succeeded'
          elif market_open and cycle_ran:
              state = 'DEGRADED'
              message = 'Market-cycle invocation completed with errors; inspect Diagnostics'
          else:
              state = 'RUNNING'
              message = '24/7 monitor heartbeat; NSE market closed, heartbeat-only interval'
          payload = {
            'state': state,
            'message': message,
            'updated_at': now.isoformat(),
            'source': 'github-actions-24x7-monitor',
            'hostname': socket.gethostname(),
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'heartbeat_interval_seconds': 300,
            'is_persistent_worker': False,
            'market_open': market_open,
            'market_cycle': market_open and cycle_ran,
            'cycle_success': cycle_success if cycle_ran else None,
            'scheduler_based_24x7_monitor': True,
          }
          fd, tmp = tempfile.mkstemp(prefix='worker-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
          RUN_CYCLE: ${{ steps.market.outputs.run_cycle }}
          CYCLE_SUCCESS: ${{ steps.run_cycle.outcome == 'success' }}

      - name: Persist scheduler and paper state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then
            echo 'No state changes.'
            exit 0
          fi
          git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "State persisted on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort || true
            git reset --soft origin/main
            git add data/ reports/
            git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]' || true
            sleep 2
          done
          echo 'Could not persist state after 5 attempts.'
          exit 1
