name: Continuous Intraday Monitor

# Paper-trading monitor: start a fresh market-validation cycle every 5 minutes
# during NSE market hours (9:15 AM-3:30 PM IST), weekdays.
"on":
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-monitor.yml'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch: {}

concurrency:
  group: continuous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ist = ZoneInfo("Asia/Kolkata")
          now = datetime.now(ist)
          event = os.getenv("GITHUB_EVENT_NAME", "")
          market_open = now.replace(hour=9, minute=15, second=0, microsecond=0)
          market_close = now.replace(hour=15, minute=30, second=0, microsecond=0)
          in_market = now.weekday() < 5 and market_open <= now <= market_close
          run_cycle = in_market or event in {"push", "workflow_dispatch"}

          if event == "schedule" and not in_market:
              reason = "outside NSE market window"
          elif in_market:
              reason = "inside NSE market window"
          else:
              reason = f"manual validation event={event}"

          print(f"IST now: {now.isoformat()}")
          print(f"Run monitor cycle: {run_cycle} ({reason})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run_cycle={'true' if run_cycle else 'false'}\n")
          PY

      - uses: actions/setup-python@v6
        if: steps.market.outputs.run_cycle == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Refresh complete NSE equity universe
        if: steps.market.outputs.run_cycle == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          import requests

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36",
              "Accept": "text/csv,application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nseindia.com/",
          })

          def emit(symbols, source):
              symbols = sorted(set(s.strip().upper() for s in symbols if s and s.strip()))
              if len(symbols) < 500:
                  raise RuntimeError(f"{source} returned only {len(symbols)} NSE EQ symbols; refusing to run a partial market scan.")
              print(f"Complete NSE EQ universe loaded from {source}: {len(symbols)} symbols")
              # GitHub Actions environment files support this comfortably for
              # the current NSE equity universe; one symbol is written once.
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                  fh.write("BOT_MARKET_UNIVERSE=" + ",".join(symbols) + "\n")
              with open("market_universe_count.txt", "w", encoding="utf-8") as fh:
                  fh.write(str(len(symbols)))

          # Primary: official NSE equity master CSV. Some GitHub-hosted runners
          # receive a challenge/HTML response, so validate the CSV before use.
          nse_error = None
          try:
              response = session.get(
                  "https://archives.nseindia.com/content/equities/EQUITY_L.csv",
                  timeout=30,
              )
              response.raise_for_status()
              text = response.content.decode("utf-8-sig", errors="replace")
              if "SYMBOL" not in text[:1000].upper():
                  raise RuntimeError("NSE response is not the expected equity CSV")
              rows = csv.DictReader(io.StringIO(text))
              symbols = []
              for row in rows:
                  symbol = str(row.get("SYMBOL", "")).strip().upper()
                  series = str(row.get("SERIES", "")).strip().upper()
                  if symbol and series == "EQ":
                      symbols.append(symbol)
              emit(symbols, "official NSE EQUITY_L.csv")
          except Exception as exc:
              nse_error = str(exc)
              print(f"Official NSE CSV unavailable: {nse_error}")

          # Fallback: Dhan's public instrument master. This is NOT a fixed list;
          # it is downloaded fresh every cycle and filtered to NSE cash equities.
          # It keeps the monitor operational when NSE blocks GitHub Actions IPs.
          if nse_error is not None:
              try:
                  response = session.get(
                      "https://images.dhan.co/api-data/api-scrip-master.csv",
                      timeout=45,
                  )
                  response.raise_for_status()
                  rows = csv.DictReader(io.StringIO(response.content.decode("utf-8-sig", errors="replace")))
                  fields = {str(f).strip().lower(): f for f in (rows.fieldnames or []) if f}

                  def field(*names):
                      for name in names:
                          if name in fields:
                              return fields[name]
                      return None

                  exchange_field = field("sem_exm_exch_id", "exchange")
                  symbol_field = field("sem_trading_symbol", "trading_symbol", "tradingsymbol", "sem_custom_symbol")
                  segment_field = field("sem_segment", "segment", "exchange_segment")
                  instrument_field = field("sem_instrument_name", "instrument_name", "instrument")
                  if not exchange_field or not symbol_field:
                      raise RuntimeError("Dhan master schema does not contain exchange and trading-symbol fields")

                  symbols = []
                  for row in rows:
                      exchange = str(row.get(exchange_field, "")).strip().upper()
                      symbol = str(row.get(symbol_field, "")).strip().upper()
                      segment = str(row.get(segment_field, "")).strip().upper() if segment_field else ""
                      instrument = str(row.get(instrument_field, "")).strip().upper() if instrument_field else ""
                      # Accept explicit NSE equity rows. If the instrument column
                      # exists, require EQUITY; if it does not, require NSE_EQ.
                      if exchange != "NSE" or not symbol:
                          continue
                      if instrument_field and instrument and instrument != "EQUITY":
                          continue
                      if segment_field and segment and segment not in {"NSE_EQ", "NSE"}:
                          continue
                      symbols.append(symbol)
                  emit(symbols, "Dhan public instrument master fallback")
              except Exception as exc:
                  raise SystemExit(
                      "Unable to obtain a complete NSE equity universe from either "
                      f"the official NSE CSV ({nse_error}) or Dhan master ({exc}). "
                      "Refusing to run a partial/fixed-stock scan."
                  ) from exc
          PY

      - name: Run one complete paper-trading market cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUTO_DISCOVER_CHAT_ID: "true"
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          DHAN_LIVE_TRADING_ENABLED: "false"
        run: python -m scripts.run_daily_cycle

      - name: Commit journal, reports and monitor health
        if: always() && steps.market.outputs.run_cycle == 'true'
        run: |
          set -e
          git config user.name "stockmarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update paper-trading monitor state [skip ci]"
            git push
          else
            echo "No monitor state changes to commit."
          fi
