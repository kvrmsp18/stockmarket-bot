name: Complete Intraday Monitor

on:
  # Scheduler runs on weekdays every 5 minutes, including outside market hours.
  # The Python market-window gate decides whether a trading cycle is allowed.
  # This keeps the Bot alive/observable all day without requiring Streamlit.
  schedule:
    - cron: '*/5 * * * 1-5'
    - cron: '0 * * * 0,6'
  push:
    branches: [main]
    paths:
      - 'intraday_bot/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/continuous-monitor.yml'
      - 'requirements.txt'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Kolkata'))
          opened=now.replace(hour=9,minute=15,second=0,microsecond=0)
          closed=now.replace(hour=15,minute=30,second=0,microsecond=0)
          weekday=now.weekday()<5
          in_window=weekday and opened<=now<=closed
          manual=os.getenv('GITHUB_EVENT_NAME') in {'workflow_dispatch','push'}
          run_cycle=in_window or manual
          print('IST:',now.isoformat(),'market_open:',in_window,'run_cycle:',run_cycle)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'run_cycle={str(run_cycle).lower()}\n')
          PY

      - name: Record off-market heartbeat
        if: steps.market.outputs.run_cycle != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, socket, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path=Path('data/scheduler_heartbeat.json'); path.parent.mkdir(parents=True,exist_ok=True)
          now=datetime.now(ZoneInfo('Asia/Kolkata'))
          payload={
            'state':'RUNNING',
            'message':'GitHub scheduler alive; market cycle gated because NSE market is closed',
            'updated_at':now.isoformat(),
            'source':'github-actions-scheduler',
            'workflow_run_id':os.getenv('GITHUB_RUN_ID'),
            'market_open':False,
            'market_cycle_interval_seconds':300,
            'off_market_schedule':'hourly weekends / every 5 minutes weekdays',
            'paper_mode':True,
            'live_order_submission':False,
          }
          fd,tmp=tempfile.mkstemp(prefix='scheduler-',suffix='.tmp',dir=str(path.parent))
          with os.fdopen(fd,'w',encoding='utf-8') as f: json.dump(payload,f,indent=2)
          os.replace(tmp,path)
          PY

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Run complete 5-minute paper cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python scripts/run_daily_cycle.py

      - name: Persist health and journal
        if: always() && steps.market.outputs.run_cycle == 'true'
        shell: bash
        run: |
          set -e
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m 'Update complete paper-trading state [skip ci]'
            git push
          else
            echo 'No state changes.'
          fi

      - name: Persist scheduler heartbeat
        if: always() && steps.market.outputs.run_cycle != 'true'
        shell: bash
        run: |
          set -e
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/scheduler_heartbeat.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update scheduler heartbeat [skip ci]'
            git push
          else
            echo 'Scheduler heartbeat unchanged.'
          fi
