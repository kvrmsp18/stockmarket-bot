name: Complete Intraday Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'intraday_bot/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/continuous-monitor.yml'
      - 'requirements.txt'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          opened = now.replace(hour=9, minute=15, second=0, microsecond=0)
          closed = now.replace(hour=15, minute=30, second=0, microsecond=0)
          weekday = now.weekday() < 5
          in_window = weekday and opened <= now <= closed
          manual = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          run_cycle = in_window or manual
          print('IST:', now.isoformat(), 'market_open:', in_window, 'run_cycle:', run_cycle)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run_cycle={str(run_cycle).lower()}\n')
              f.write(f'market_open={str(in_window).lower()}\n')
          PY

      - name: Record scheduler heartbeat
        shell: bash
        run: |
          python - <<'PY'
          import json, os, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/scheduler_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          market_open = os.getenv('MARKET_OPEN') == 'true'
          payload = {
            'state': 'RUNNING',
            'message': '24/7 scheduled monitor heartbeat is active',
            'updated_at': now.isoformat(),
            'source': 'github-actions-scheduler',
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'event': os.getenv('GITHUB_EVENT_NAME'),
            'market_open': market_open,
            'scheduled_interval_seconds': 300,
            'paper_mode': True,
            'live_order_submission': False,
          }
          fd, tmp = tempfile.mkstemp(prefix='scheduler-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Dhan authentication and market-feed preflight
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from intraday_bot.brokers import DhanBroker
          from intraday_bot.config import settings

          def fail(message: str) -> None:
              path = Path('data/monitor_status.json')
              path.parent.mkdir(parents=True, exist_ok=True)
              now = datetime.now(ZoneInfo('Asia/Kolkata')).isoformat()
              payload = {
                  'cycle_id': 'PREFLIGHT-' + datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y%m%dT%H%M%S%f'),
                  'started_at': now,
                  'ended_at': now,
                  'mode': 'PAPER',
                  'market_open': os.getenv('MARKET_OPEN') == 'true',
                  'stocks_observed': 0,
                  'quotes': 0,
                  'deep_analysis_pool': 0,
                  'dynamic_pool': True,
                  'candidates': [],
                  'rejections': {},
                  'rejection_details': [],
                  'orders': [],
                  'errors': [message],
                  'execution_gate': 'PREFLIGHT_FAILED',
              }
              path.write_text(json.dumps(payload, indent=2), encoding='utf-8')
              raise SystemExit(message)

          print('Dhan credential source:', settings.dhan_market_data_credential_source)
          print('Dhan client configured:', bool(settings.dhan_client_id))
          print('Dhan API key configured:', bool(settings.dhan_api_key))
          print('Dhan PIN configured:', bool(settings.dhan_pin))
          print('Dhan TOTP secret configured:', bool(settings.dhan_totp_secret))
          print('Dhan explicit access token configured:', bool(settings.dhan_access_token))
          try:
              token = settings.dhan_market_data_token
          except Exception as exc:
              fail('DHAN_PREFLIGHT_ERROR: automatic token generation failed: ' + str(exc))
          print('Dhan access token available:', bool(token))
          print('Dhan access token length:', len(token))
          if not token:
              fail('DHAN_PREFLIGHT_ERROR: no Dhan Access Token available')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('DHAN_ACCESS_TOKEN=' + token + '\n')
          print('Dhan access token prepared for reuse by the cycle.')

          try:
              health = DhanBroker().health()
          except Exception as exc:
              fail('DHAN_PREFLIGHT_ERROR: ' + str(exc))
          print('Dhan authentication:', health.message)
          if not health.authenticated:
              fail('DHAN_PREFLIGHT_ERROR: ' + health.message)

          raw = settings.dhan_security_ids_json.strip()
          if raw:
              try:
                  mapping = json.loads(raw)
              except json.JSONDecodeError:
                  fail('DHAN_QUOTE_PREFLIGHT_FAILED: invalid DHAN_SECURITY_IDS_JSON')
              instruments = []
              for symbol, value in mapping.items():
                  if isinstance(value, dict):
                      sid = value.get('security_id')
                      segment = value.get('exchange_segment', 'NSE_EQ')
                  else:
                      sid = value
                      segment = 'NSE_EQ'
                  if sid:
                      instruments.append({'symbol': str(symbol), 'security_id': sid, 'exchange_segment': segment})
                  if len(instruments) >= 1:
                      break
              if instruments:
                  try:
                      quotes = DhanBroker().bulk_quotes(instruments)
                  except Exception as exc:
                      fail('DHAN_QUOTE_PREFLIGHT_FAILED: ' + str(exc))
                  print('Dhan market-feed preflight quotes:', len(quotes))
                  if not quotes:
                      fail('DHAN_QUOTE_PREFLIGHT_FAILED: market-feed returned zero quotes')
                  print('DHAN_MARKET_DATA_PREFLIGHT_PASSED')
              else:
                  print('DHAN_QUOTE_PREFLIGHT_SKIPPED: no mapped security ID')
          else:
              print('DHAN_QUOTE_PREFLIGHT_SKIPPED: DHAN_SECURITY_IDS_JSON not configured')
          print('DHAN_AUTH_PREFLIGHT_PASSED')
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Verify Dhan quotes against fresh universe
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from intraday_bot.brokers import DhanBroker
          from intraday_bot.config import settings

          universe = json.loads(Path('data/universe.json').read_text(encoding='utf-8'))
          if not universe:
              raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: universe is empty')
          sample = universe[:10]
          try:
              quotes = DhanBroker().bulk_quotes(sample)
          except Exception as exc:
              raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: ' + str(exc))
          print('Fresh universe symbols:', len(universe))
          print('Fresh universe quote sample:', len(quotes))
          if not quotes:
              raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: fresh universe returned zero quotes')
          print('DHAN_FRESH_UNIVERSE_QUOTE_VERIFY_PASSED')
          PY

      - name: Run complete 5-minute paper cycle
        id: run_cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: '1000'
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python scripts/run_daily_cycle.py

      - name: Record monitor heartbeat
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, socket, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/worker_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          market_open = os.getenv('MARKET_OPEN') == 'true'
          cycle_ran = os.getenv('RUN_CYCLE') == 'true'
          cycle_success = os.getenv('CYCLE_SUCCESS') == 'true'
          if market_open and cycle_ran and cycle_success:
              state = 'RUNNING'
              message = 'Latest complete paper-trading market cycle succeeded'
          elif market_open and cycle_ran:
              state = 'DEGRADED'
              message = 'Market-cycle invocation failed; inspect Diagnostics'
          else:
              state = 'HEARTBEAT_ONLY'
              message = '24/7 monitor heartbeat active; NSE market is closed or cycle is not scheduled'
          payload = {
            'state': state,
            'message': message,
            'updated_at': now.isoformat(),
            'source': 'github-actions-monitor',
            'hostname': socket.gethostname(),
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'heartbeat_interval_seconds': 300,
            'is_persistent_worker': False,
            'market_open': market_open,
            'market_cycle': market_open and cycle_ran,
            'cycle_success': cycle_success if cycle_ran else None,
            'scheduler_based_monitor': True,
          }
          fd, tmp = tempfile.mkstemp(prefix='worker-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
          RUN_CYCLE: ${{ steps.market.outputs.run_cycle }}
          CYCLE_SUCCESS: ${{ steps.run_cycle.outcome == 'success' }}

      - name: Persist scheduler and paper state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then
            echo 'No state changes.'
            exit 0
          fi
          git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "State persisted on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort || true
            git reset --soft origin/main
            git add data/ reports/
            git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]' || true
            sleep 2
          done
          echo 'Unable to persist state after 5 attempts.'
          exit 1
