name: Complete Intraday Monitor

on:
  # The scheduler stays active all day. During NSE hours it runs the full
  # paper-trading cycle every 5 minutes. Outside market hours it records
  # scheduler health only and NEVER executes trading analysis/orders.
  schedule:
    - cron: '*/5 * * * 1-5'
    - cron: '0 * * * 0,6'
  push:
    branches: [main]
    paths:
      - 'intraday_bot/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/continuous-monitor.yml'
      - 'requirements.txt'
      - 'runtime-fix-trigger.txt'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply dashboard runtime fix
        if: github.event_name == 'push' && hashFiles('runtime-fix-trigger.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          s = s.replace('from urllib.request import urlopen', 'from urllib.request import Request, urlopen', 1)

          new_sync = '''def sync_remote_state(force: bool = False) -> bool:
              """Synchronize the Streamlit copy with the latest committed Bot state."""
              now = time.time()
              last = float(st.session_state.get("_remote_state_sync", 0.0))
              if not force and now - last < 60:
                  return True
              base = "https://raw.githubusercontent.com/kvrmsp18/stockmarket-bot/main/data/"
              targets = {
                  "trading.db": Path("data/trading.db"),
                  "monitor_status.json": Path("data/monitor_status.json"),
                  "scheduler_heartbeat.json": Path("data/scheduler_heartbeat.json"),
                  "worker_heartbeat.json": Path("data/worker_heartbeat.json"),
                  "watchdog_heartbeat.json": Path("data/watchdog_heartbeat.json"),
              }
              ok = False
              for name, dest in targets.items():
                  tmp = None
                  try:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      url = f"{base}{name}?dashboard_sync={int(now * 1000)}"
                      request = Request(url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache"})
                      with urlopen(request, timeout=15) as response:
                          data = response.read()
                      import tempfile
                      fd, tmp = tempfile.mkstemp(prefix="remote-state-", dir=str(dest.parent))
                      with os.fdopen(fd, "wb") as f:
                          f.write(data)
                      os.replace(tmp, dest)
                      ok = True
                  except Exception:
                      if tmp and os.path.exists(tmp):
                          try:
                              os.unlink(tmp)
                          except Exception:
                              pass
              st.session_state["_remote_state_sync"] = now
              return ok


'''
          s, n = re.subn(r'def sync_remote_state\(force: bool = False\) -> bool:\n.*?(?=\ndef status\(\) -> dict\[str, Any\]:)', new_sync, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('sync replacement failed')

          new_hb = '''def heartbeat() -> dict[str, Any]:
              """Return only the real trading-worker heartbeat, never scheduler/watchdog state."""
              if not HEARTBEAT.exists():
                  return {}
              try:
                  payload = json.loads(HEARTBEAT.read_text(encoding="utf-8"))
                  return payload if payload else {}
              except Exception:
                  return {}


'''
          s, n = re.subn(r'def heartbeat\(\) -> dict\[str, Any\]:\n.*?(?=\ndef sql\()', new_hb, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('heartbeat replacement failed')

          old_refresh = '''    if st.sidebar.button("🔄 Refresh Search / Dashboard", use_container_width=True):
        sync_remote_state(force=True)
        st.cache_data.clear()
        st.rerun()
'''
          new_refresh = '''    if st.session_state.pop("_refresh_message", False):
        st.sidebar.success("Dashboard state refreshed from GitHub.")
    if st.session_state.pop("_refresh_failed", False):
        st.sidebar.error("Dashboard refresh could not reach the persisted GitHub state.")
    if st.sidebar.button("🔄 Refresh Search / Dashboard", key="refresh_dashboard_button", use_container_width=True):
        ok = sync_remote_state(force=True)
        st.cache_data.clear()
        st.session_state["_refresh_message"] = bool(ok)
        st.session_state["_refresh_failed"] = not bool(ok)
        st.rerun()
'''
          if old_refresh not in s: raise SystemExit('refresh replacement failed')
          s = s.replace(old_refresh, new_refresh, 1)

          old_hb = '''    if hb.get("state") == "ERROR": st.error(f"24/7 WORKER ERROR: {hb.get('message','Unknown error')}")
    elif hb: st.success(f"24/7 WORKER: {hb.get('state','RUNNING')} · last heartbeat {hb.get('updated_at','—')}")
    else: st.warning("24/7 WORKER: heartbeat unavailable. Start scripts/worker.py on the always-on server.")
'''
          new_hb_display = '''    if hb:
        try:
            from datetime import datetime, timezone
            stamp = str(hb.get("updated_at", ""))
            age_seconds = max(0.0, (datetime.now(timezone.utc) - datetime.fromisoformat(stamp).astimezone(timezone.utc)).total_seconds())
        except Exception:
            age_seconds = float("inf")
        if hb.get("state") == "ERROR":
            st.error(f"24/7 WORKER ERROR: {hb.get('message','Unknown error')} · last heartbeat {hb.get('updated_at','—')}")
        elif age_seconds > 900:
            st.error(f"24/7 WORKER: OFFLINE · last real worker heartbeat {hb.get('updated_at','—')} ({age_seconds/60:.1f} min ago)")
        else:
            st.success(f"24/7 WORKER: ONLINE · last real worker heartbeat {hb.get('updated_at','—')}")
    else:
        st.error("24/7 WORKER: OFFLINE · no real trading-worker heartbeat is available")
    scheduler_path = Path("data/scheduler_heartbeat.json")
    if scheduler_path.exists():
        try:
            sh = json.loads(scheduler_path.read_text(encoding="utf-8"))
            st.caption(f"Automation scheduler: {sh.get('state','UNKNOWN')} · last invocation {sh.get('updated_at','—')} · market window {'ACTIVE' if sh.get('market_open') else 'CLOSED'}")
        except Exception:
            pass
'''
          if old_hb not in s: raise SystemExit('dashboard heartbeat replacement failed')
          s = s.replace(old_hb, new_hb_display, 1)
          app.write_text(s, encoding='utf-8')
          PY

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          opened = now.replace(hour=9, minute=15, second=0, microsecond=0)
          closed = now.replace(hour=15, minute=30, second=0, microsecond=0)
          weekday = now.weekday() < 5
          in_window = weekday and opened <= now <= closed
          manual = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          run_cycle = in_window or manual
          print('IST:', now.isoformat(), 'market_open:', in_window, 'run_cycle:', run_cycle)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run_cycle={str(run_cycle).lower()}\n')
          PY

      - name: Record scheduler heartbeat
        shell: bash
        run: |
          python - <<'PY'
          import json, os, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/scheduler_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          market_open = os.getenv('RUN_CYCLE') == 'true'
          payload = {
            'state': 'RUNNING',
            'message': 'GitHub Actions scheduler invocation completed',
            'updated_at': now.isoformat(),
            'source': 'github-actions-scheduler',
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'event': os.getenv('GITHUB_EVENT_NAME'),
            'market_open': market_open,
            'scheduled_interval_seconds': 300,
            'paper_mode': True,
            'live_order_submission': False,
          }
          fd, tmp = tempfile.mkstemp(prefix='scheduler-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          RUN_CYCLE: ${{ steps.market.outputs.run_cycle }}

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Run complete 5-minute paper cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: '1000'
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python scripts/run_daily_cycle.py

      - name: Record real trading-worker heartbeat
        if: steps.market.outputs.run_cycle == 'true' && success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, socket, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/worker_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          payload = {
            'state': 'RUNNING',
            'message': 'Latest complete paper-trading cycle succeeded',
            'updated_at': now.isoformat(),
            'source': 'github-actions-paper-cycle',
            'hostname': socket.gethostname(),
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'heartbeat_interval_seconds': 300,
            'is_persistent_worker': False,
            'market_cycle': True,
          }
          fd, tmp = tempfile.mkstemp(prefix='worker-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY

      - name: Persist scheduler and paper state
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/ app.py
          if [ -f runtime-fix-trigger.txt ]; then
            git rm -f runtime-fix-trigger.txt
          fi
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m 'Update Bot scheduler, worker heartbeat and dashboard state [skip ci]'
            git push
          else
            echo 'No state changes.'
          fi
