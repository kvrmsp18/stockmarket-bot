name: Complete Intraday Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'
  FUNDAMENTALS_REFRESH_SECONDS: '604800'
  FUNDAMENTALS_REFRESH_PER_CYCLE: '2'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          opened = now.replace(hour=9, minute=15, second=0, microsecond=0)
          closed = now.replace(hour=15, minute=30, second=0, microsecond=0)
          market_open = now.weekday() < 5 and opened <= now <= closed
          manual = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          run_cycle = market_open or manual
          print('IST:', now.isoformat(), 'market_open:', market_open, 'run_cycle:', run_cycle)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run_cycle={str(run_cycle).lower()}\n')
              f.write(f'market_open={str(market_open).lower()}\n')
          PY

      - name: Record scheduler heartbeat
        shell: bash
        run: |
          python - <<'PY'
          import json, os, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/scheduler_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          market_open = os.getenv('MARKET_OPEN') == 'true'
          payload = {
            'state': 'RUNNING',
            'message': '24/7 scheduled monitor heartbeat is active',
            'updated_at': now.isoformat(),
            'source': 'github-actions-scheduler',
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'event': os.getenv('GITHUB_EVENT_NAME'),
            'market_open': market_open,
            'scheduled_interval_seconds': 300,
            'paper_mode': True,
            'live_order_submission': False,
          }
          fd, tmp = tempfile.mkstemp(prefix='scheduler-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Dhan manual-token market-feed preflight
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from intraday_bot.brokers import DhanBroker
          from intraday_bot.config import settings

          path = Path('data/preflight_status.json')

          def write_status(message, passed):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps({
                  'status': 'PASSED' if passed else 'FAILED',
                  'message': message,
                  'updated_at': datetime.now(ZoneInfo('Asia/Kolkata')).isoformat(),
                  'source': 'github-actions-dhan-preflight',
                  'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
                  'mode': 'PAPER',
                  'market_open': os.getenv('MARKET_OPEN') == 'true',
                  'live_order_submission': False,
              }, indent=2), encoding='utf-8')

          token = settings.dhan_market_data_token
          print('Dhan credential source:', settings.dhan_market_data_credential_source)
          print('Dhan client configured:', bool(settings.dhan_client_id))
          print('Dhan manually entered token configured:', bool(token))
          print('Dhan manually entered token length:', len(token))
          if not settings.dhan_client_id or not token:
              write_status('Dhan manual authentication is unavailable: DHAN_CLIENT_ID and DHAN_API_KEY are required', False)
              raise SystemExit('DHAN_PREFLIGHT_ERROR: manually entered Dhan token is unavailable')

          try:
              health = DhanBroker().health()
          except Exception as exc:
              write_status('Dhan preflight failed: ' + str(exc), False)
              raise SystemExit('DHAN_PREFLIGHT_ERROR: ' + str(exc))
          print('Dhan authentication:', health.message)
          if not health.authenticated:
              write_status(health.message, False)
              raise SystemExit('DHAN_PREFLIGHT_ERROR: ' + health.message)

          raw = settings.dhan_security_ids_json.strip()
          if raw:
              try:
                  mapping = json.loads(raw)
              except json.JSONDecodeError:
                  write_status('Invalid DHAN_SECURITY_IDS_JSON', False)
                  raise SystemExit('DHAN_QUOTE_PREFLIGHT_FAILED: invalid DHAN_SECURITY_IDS_JSON')
              instruments = []
              for symbol, value in mapping.items():
                  if isinstance(value, dict):
                      sid = value.get('security_id')
                      segment = value.get('exchange_segment', 'NSE_EQ')
                  else:
                      sid = value
                      segment = 'NSE_EQ'
                  if sid:
                      instruments.append({'symbol': str(symbol), 'security_id': sid, 'exchange_segment': segment})
                  if len(instruments) >= 1:
                      break
              if instruments:
                  quotes = DhanBroker().bulk_quotes(instruments)
                  print('Dhan market-feed preflight quotes:', len(quotes))
                  if not quotes:
                      write_status('Market-feed returned zero quotes', False)
                      raise SystemExit('DHAN_QUOTE_PREFLIGHT_FAILED: market-feed returned zero quotes')
          write_status('Dhan manually entered token and market-feed preflight passed', True)
          print('DHAN_MANUAL_TOKEN_PREFLIGHT_PASSED')
          PY

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Verify Dhan quotes against fresh universe
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from intraday_bot.brokers import DhanBroker
          universe = json.loads(Path('data/universe.json').read_text(encoding='utf-8'))
          if not universe:
              raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: universe is empty')
          candidates = [x for x in universe if 'NSETEST' not in str(x.get('symbol', '')).upper()]
          sample = candidates[:10]
          if not sample:
              raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: no real equity symbols remain')
          quotes = DhanBroker().bulk_quotes(sample)
          print('Fresh universe symbols:', len(universe))
          print('Fresh universe quote sample:', len(quotes))
          if not quotes:
              raise SystemExit('DHAN_UNIVERSE_VERIFY_FAILED: fresh universe returned zero quotes')
          print('DHAN_FRESH_UNIVERSE_QUOTE_VERIFY_PASSED')
          PY

      - name: Run complete 5-minute paper cycle
        id: run_cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: '1000'
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
          FUNDAMENTALS_REFRESH_SECONDS: '604800'
          FUNDAMENTALS_REFRESH_PER_CYCLE: '2'
        run: python scripts/run_daily_cycle.py

      - name: Record monitor heartbeat
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, socket, tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('data/worker_heartbeat.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          market_open = os.getenv('MARKET_OPEN') == 'true'
          cycle_ran = os.getenv('RUN_CYCLE') == 'true'
          cycle_success = os.getenv('CYCLE_SUCCESS') == 'true'
          if market_open and cycle_ran and cycle_success:
              state = 'RUNNING'
              message = 'Latest complete paper-trading market cycle succeeded'
          elif market_open and cycle_ran:
              state = 'DEGRADED'
              message = 'Market-cycle invocation failed; inspect preflight_status or Diagnostics'
          else:
              state = 'HEARTBEAT_ONLY'
              message = '24/7 monitor heartbeat active; NSE market is closed or cycle is not scheduled'
          payload = {
            'state': state,
            'message': message,
            'updated_at': datetime.now(ZoneInfo('Asia/Kolkata')).isoformat(),
            'source': 'github-actions-monitor',
            'hostname': socket.gethostname(),
            'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
            'heartbeat_interval_seconds': 300,
            'is_persistent_worker': False,
            'market_open': market_open,
            'market_cycle': market_open and cycle_ran,
            'cycle_success': cycle_success if cycle_ran else None,
            'scheduler_based_monitor': True,
          }
          fd, tmp = tempfile.mkstemp(prefix='worker-', suffix='.tmp', dir=str(path.parent))
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          os.replace(tmp, path)
          PY
        env:
          MARKET_OPEN: ${{ steps.market.outputs.market_open }}
          RUN_CYCLE: ${{ steps.market.outputs.run_cycle }}
          CYCLE_SUCCESS: ${{ steps.run_cycle.outcome == 'success' }}

      - name: Persist scheduler and paper state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then
            echo 'No state changes.'
            exit 0
          fi
          git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "State persisted on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort || true
            git reset --soft origin/main
            git add data/ reports/
            git commit -m 'Update Bot scheduler, worker heartbeat and paper state [skip ci]' || true
            sleep 2
          done
          echo 'Unable to persist state after 5 attempts.'
          exit 1
