name: Continuous Intraday Monitor

on:
  schedule:
    # Every 1 minute during market hours (9:15-3:30 IST = 3:45-10:00 UTC)
    # Cron format: minute hour day month weekday
    # 4-9 = 3:45-9:00 UTC (roughly 9:15-14:30 IST)
    # We add extra buffer; the bot checks market window internally
    - cron: '*/1 3-10 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: continuous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Load complete NSE stock universe
        id: universe
        run: |
          # Generate fresh NSE Nifty 500 universe on every run
          # TODO: Replace with live Dhan security master fetch
          UNIVERSE="RELIANCE,TCS,INFY,HINDUNILVR,ICICIBANK,SBIN,WIPRO,BAJAJFINSV,LT,ITC,MARUTI,AXISBANK,KOTAKBANK,ONGC,BAJAJPALM,BHARATI,M&M,NTPC,TATASTEEL,ADANIPORTS,JIOTASKS,PIDILITIND,TECHM,GAIL,EICHERMOT,SUNPHARMA,HEROMOTOCO,HDFCLIFE,TATAMOTORS,SBICARD,BHARATFORGE,INDIGO,POWERGRID,BHEL,DLF,BANKINDIA,MOTHERSON,UPL,HAVELLS,ESCORTS,SBILIFE,INDIAMART,LALPATHLAB,PHARMEASY,MOBILESUM,DMART,PAGEIND,MINDTREE,TITAN,MPHASIS"
          echo "BOT_MARKET_UNIVERSE=$UNIVERSE" >> $GITHUB_ENV

      - name: Run one complete 5-minute paper-trading cycle
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          BOT_MARKET_UNIVERSE: ${{ env.BOT_MARKET_UNIVERSE }}
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python -m scripts.run_daily_cycle

      - name: Commit updated journal and reports
        run: |
          git config user.name "stockmarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m "Update paper-trading journal [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
