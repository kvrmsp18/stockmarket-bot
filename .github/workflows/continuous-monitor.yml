name: Continuous Intraday Monitor

# Paper-trading monitor: run a complete monitor cycle every 5 minutes
# during NSE market hours (9:15 AM-3:30 PM IST), weekdays.
# GitHub Actions cron is UTC (IST = UTC+5:30), so the schedule wakes
# every 5 minutes across the broad window and the job itself enforces
# the exact NSE market window.
"on":
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-monitor.yml'
  workflow_dispatch: {}

concurrency:
  group: continuous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ist = ZoneInfo("Asia/Kolkata")
          now = datetime.now(ist)
          event = os.getenv("GITHUB_EVENT_NAME", "")

          # Scheduled cycles run only during the NSE cash-market window.
          # Push/manual runs are allowed immediately for validation.
          market_open = now.replace(hour=9, minute=15, second=0, microsecond=0)
          market_close = now.replace(hour=15, minute=30, second=0, microsecond=0)
          in_market = now.weekday() < 5 and market_open <= now <= market_close
          run_cycle = in_market or event in {"push", "workflow_dispatch"}

          if event == "schedule" and not in_market:
              reason = "outside NSE market window"
          elif in_market:
              reason = "inside NSE market window"
          else:
              reason = f"manual validation event={event}"

          print(f"IST now: {now.isoformat()}")
          print(f"Run monitor cycle: {run_cycle} ({reason})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run_cycle={'true' if run_cycle else 'false'}\n")
          PY

      - uses: actions/setup-python@v6
        if: steps.market.outputs.run_cycle == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Run one monitor cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUTO_DISCOVER_CHAT_ID: "true"
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          DHAN_LIVE_TRADING_ENABLED: "false"
        run: python -m scripts.run_daily_cycle

      - name: Commit journal, reports and monitor health
        if: always() && steps.market.outputs.run_cycle == 'true'
        run: |
          set -e
          git config user.name "stockmarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update paper-trading monitor state [skip ci]"
            git push
          else
            echo "No monitor state changes to commit."
          fi
