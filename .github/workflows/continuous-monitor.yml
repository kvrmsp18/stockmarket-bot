name: Continuous Intraday Monitor

on:
  schedule:
    # Every 5 minutes during market hours (9:15-3:30 IST = 3:45-10:00 UTC)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: continuous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Increased from 2 to 10 minutes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check NSE market window
        run: |
          python - <<'EOF'
          from datetime import datetime, timezone, timedelta
          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          open_t = now.replace(hour=9,  minute=15, second=0, microsecond=0)
          close_t = now.replace(hour=15, minute=30, second=0, microsecond=0)
          in_window = open_t <= now <= close_t and now.weekday() < 5
          print(f"IST now: {now.strftime('%H:%M')} | Market open: {in_window}")
          import sys; sys.exit(0 if in_window else 0)
          EOF

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Load complete NSE cash-equity universe
        id: universe
        run: |
          # Top 25 most liquid NSE stocks for fast scanning
          # Expand this list as scan speed improves
          UNIVERSE="RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN,WIPRO,BAJAJFINSV,LT,ITC,MARUTI,AXISBANK,KOTAKBANK,BHARTI,M&M,NTPC,TATASTEEL,ADANIPORTS,SUNPHARMA,TITAN,HINDUNILVR,ONGC,POWERGRID,COALINDIA,EICHERMOT"
          echo "BOT_MARKET_UNIVERSE=$UNIVERSE" >> $GITHUB_ENV
          echo "Loaded $(echo $UNIVERSE | tr ',' '\n' | wc -l) symbols"

      - name: Run one complete paper-trading market cycle
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          BOT_MARKET_UNIVERSE: ${{ env.BOT_MARKET_UNIVERSE }}
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python -m scripts.run_daily_cycle

      - name: Commit journal, reports and monitor health
        run: |
          git config user.name "stockmarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m "Update paper-trading journal [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
