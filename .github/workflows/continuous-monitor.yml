name: Continuous Intraday Monitor

# Run every 1 minute during market hours only (9:30-3:30 IST, weekdays)
# GitHub minimum: 5 minutes. This is the fastest practical option on GitHub Actions.
"on":
  schedule:
    # Every 1 minute during trading hours (9:30 AM - 3:30 PM IST)
    # Cron format: minute hour day month day-of-week
    # 4-9 in UTC = 9:30-3:30 IST (UTC+5:30)
    # 1-5 = Mon-Fri
    - cron: '*/1 4-9 * * 1-5'
  workflow_dispatch: {}  # Manual trigger from Actions tab

concurrency:
  group: continuous-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2  # Keep this short — each cycle should finish in < 30 seconds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt --quiet

      - name: Run one monitor cycle
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          DHAN_LIVE_TRADING_ENABLED: "false"
        run: python -m scripts.run_daily_cycle

      - name: Commit updated journal and reports
        run: |
          git config user.name "stockmarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m "Update paper-trading journal [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
