name: Complete Intraday Monitor

on:
  schedule:
    - cron: '45,50,55 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'intraday_bot/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/continuous-monitor.yml'
      - 'requirements.txt'
  workflow_dispatch: {}

concurrency:
  group: complete-intraday-monitor
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  USE_DHAN_DATA: 'true'
  SCAN_WORKERS: '8'
  CYCLE_BUDGET_SECONDS: '240'
  DHAN_LIVE_TRADING_ENABLED: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NSE market window
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Kolkata'))
          opened=now.replace(hour=9,minute=15,second=0,microsecond=0)
          closed=now.replace(hour=15,minute=30,second=0,microsecond=0)
          in_window=now.weekday()<5 and opened<=now<=closed
          manual=os.getenv('GITHUB_EVENT_NAME') in {'workflow_dispatch','push'}
          run_cycle=in_window or manual
          print('IST:',now.isoformat(),'run_cycle:',run_cycle)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'run_cycle={str(run_cycle).lower()}\n')
          PY

      - name: Setup Python
        if: steps.market.outputs.run_cycle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.market.outputs.run_cycle == 'true'
        run: pip install -r requirements.txt --quiet

      - name: Build complete NSE cash-equity universe
        if: steps.market.outputs.run_cycle == 'true'
        run: python scripts/load_universe.py

      - name: Run complete 5-minute paper cycle
        if: steps.market.outputs.run_cycle == 'true'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          BOT_MODE: PAPER
          DHAN_LIVE_TRADING_ENABLED: 'false'
        run: python scripts/run_daily_cycle.py

      - name: Persist health and journal
        if: always() && steps.market.outputs.run_cycle == 'true'
        shell: bash
        run: |
          set -e
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m 'Update complete paper-trading state [skip ci]'
            git push
          else
            echo 'No state changes.'
          fi
