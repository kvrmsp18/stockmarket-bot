name: Monitor Kick Safety Net

# The normal monitor remains scheduled every 15 minutes. This safety-net
# workflow executes a fresh monitor cycle whenever production/config/workflow
# code changes, so a changed workflow is immediately exercised instead of
# waiting for the next scheduled run.
"on":
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch: {}

concurrency:
  group: monitor-kick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor-kick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run monitor cycle
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_SECURITY_IDS_JSON: ${{ secrets.DHAN_SECURITY_IDS_JSON }}
          BSE_SCRIP_CODES_JSON: ${{ secrets.BSE_SCRIP_CODES_JSON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_RESEARCH_REFERENCE_CAPITAL: ${{ vars.BOT_RESEARCH_REFERENCE_CAPITAL }}
          DHAN_LIVE_TRADING_ENABLED: "false"
        run: python -m scripts.run_daily_cycle

      - name: Persist monitor state
        if: always()
        run: |
          git config user.name "stockmarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash
            git commit -m "Persist monitor kick state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
