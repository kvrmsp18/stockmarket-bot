name: Finish Runtime Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hardening-finish.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Apply migration
        run: python scripts/apply_runtime_hardening.py

      - name: Validate
        run: |
          python -m py_compile intraday_bot/runtime.py scripts/eod_report.py
          PYTHONPATH=. pytest -q

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intraday_bot/runtime.py
          git rm scripts/apply_runtime_hardening.py .github/workflows/hardening-finish.yml
          git commit -m 'fix: enforce portfolio safety and cycle telemetry [skip ci]'
          git fetch origin main
          git rebase origin/main
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
