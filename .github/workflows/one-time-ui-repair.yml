name: One-time UI Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-ui-repair.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply complete app.py repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          text=p.read_text(encoding='utf-8')

          old='''def sync():\n    now=time.time(); last=st.session_state.get("sync",0)\n    if now-last<60:return True\n'''
          new='''def sync(force=False):\n    now=time.time(); last=st.session_state.get("sync",0)\n    if not force and now-last<60:return True\n'''
          if old not in text:
              raise SystemExit('UI_REPAIR_FAILED: sync function block not found')
          text=text.replace(old,new,1)

          old='''    st.write(f"**Trading heartbeat:** {h.get('state','NOT FOUND')} · {h.get('updated_at','—')}")\n    st.write(f"**Scheduler:** {sh.get('state','NOT FOUND')} · {sh.get('updated_at','—')} · market {'OPEN' if sh.get('market_open') else 'CLOSED'}")\n    cdf=pd.DataFrame(s.get("candidates",[])); st.subheader("Actionable candidates")\n    st.dataframe(cdf,use_container_width=True,hide_index=True) if not cdf.empty else st.warning("No actionable candidates persisted. Diagnostics and Rejected Signals show the exact reason.")\n'''
          new='''    cycle_errors=s.get("errors") or []\n    age_seconds=(time.time()-time.mktime(time.strptime(h.get("updated_at","")[:19],"%Y-%m-%dT%H:%M:%S"))) if h.get("updated_at") else 10**9\n    if h.get("state")=="ERROR":\n        st.error(f"TRADING ENGINE ERROR: {h.get('message','Unknown error')} · last heartbeat {h.get('updated_at','—')}")\n    elif age_seconds>900:\n        st.error(f"TRADING ENGINE: OFFLINE · last real cycle heartbeat {h.get('updated_at','—')} ({age_seconds/60:.1f} min ago)")\n    elif h.get("state")=="DEGRADED":\n        detail=f" — {cycle_errors[0]}" if cycle_errors else f" — {h.get('message','cycle completed with errors')}"\n        st.warning(f"TRADING ENGINE: DEGRADED · last cycle attempt {h.get('updated_at','—')}{detail}")\n    else:\n        st.success(f"TRADING ENGINE: ONLINE · last successful market cycle {h.get('updated_at','—')}")\n    st.write(f"**Scheduler:** {sh.get('state','NOT FOUND')} · {sh.get('updated_at','—')} · market {'OPEN' if sh.get('market_open') else 'CLOSED'}")\n    cdf=pd.DataFrame(s.get("candidates",[])); st.subheader("Actionable candidates")\n    if cdf.empty:\n        if cycle_errors: st.error(f"Latest cycle failed before producing candidates: {cycle_errors[0]}")\n        else: st.warning("No actionable candidates persisted. Diagnostics and Rejected Signals show the exact reason.")\n    else: st.dataframe(cdf,use_container_width=True,hide_index=True)\n'''
          if old not in text:
              raise SystemExit('UI_REPAIR_FAILED: dashboard status block not found')
          text=text.replace(old,new,1)

          old='''    if st.sidebar.button("🔄 Refresh Search / Dashboard",key="refresh_button"):sync();st.rerun()\n'''
          new='''    if st.sidebar.button("🔄 Refresh Search / Dashboard",key="refresh_button"):\n        sync(force=True)\n        st.rerun()\n'''
          if old not in text:
              raise SystemExit('UI_REPAIR_FAILED: refresh button block not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          print('UI repair applied successfully')
          PY
          python -m py_compile app.py

      - name: Commit repaired app and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-ui-repair.yml
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py .github/workflows/one-time-ui-repair.yml
          git commit -m 'fix: repair dashboard state and force refresh [skip ci]'
          git push origin HEAD:main
