name: Export Source Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - BOT_RAW_SOURCE_AUDIT.txt
      - data/**
      - reports/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Validate source runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py intraday_bot/*.py scripts/*.py
          PYTHONPATH=. pytest -q

      - name: Generate complete source audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import subprocess

          root = Path('.')
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          now = datetime.now(timezone.utc).isoformat()
          excluded_dirs = {'.git', '.venv', 'venv', '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache', 'node_modules'}
          excluded_names = {'BOT_RAW_SOURCE_AUDIT.txt'}
          binary_ext = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.pdf','.zip','.gz','.tar','.db','.sqlite','.sqlite3','.parquet','.feather','.xlsx','.xls'}
          max_bytes = 2_000_000
          files = []
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel = p.relative_to(root)
              if any(part in excluded_dirs for part in rel.parts) or p.name in excluded_names: continue
              try: size = p.stat().st_size
              except OSError: continue
              files.append((rel, size))
          if not files: raise SystemExit('AUDIT_GENERATION_FAILED: repository file inventory is empty')
          out = [
              '====================================================================',
              'BOT_RAW_SOURCE_AUDIT.txt — COMPLETE CURRENT SOURCE AUDIT',
              '====================================================================',
              'Repository: kvrmsp18/stockmarket-bot',
              'Branch: main',
              f'Commit SHA: {sha}',
              f'Generated UTC: {now}',
              '',
              'This file is generated automatically from a fresh checkout of main.',
              'Secrets are not read or exported. Binary files and large files are listed',
              'but their raw bytes are not embedded.',
              '',
              '====================================================================',
              'FILE INVENTORY',
              '====================================================================',
          ]
          for rel, size in files: out.append(f'{rel.as_posix()}\t{size} bytes')
          for rel, size in files:
              path = root / rel
              out += ['', '====================================================================', f'FILE: {rel.as_posix()}', f'SIZE: {size} bytes', '====================================================================']
              if rel.suffix.lower() in binary_ext:
                  out.append('[BINARY/GENERATED FILE — CONTENT NOT EMBEDDED]'); continue
              if size > max_bytes:
                  out.append('[LARGE FILE > 2 MB — CONTENT NOT EMBEDDED]'); continue
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  out.append('[NON-UTF8 FILE — CONTENT NOT EMBEDDED]'); continue
              except OSError as exc:
                  out.append(f'[READ ERROR — CONTENT NOT EMBEDDED: {exc}]'); continue
              out.append(text.rstrip('\n'))
          audit = '\n'.join(out) + '\n'
          if len(audit.strip()) < 500: raise SystemExit(f'AUDIT_GENERATION_FAILED: generated audit is unexpectedly small ({len(audit)} bytes)')
          if 'FILE INVENTORY' not in audit or 'FILE: ' not in audit: raise SystemExit('AUDIT_GENERATION_FAILED: required audit sections are missing')
          Path('BOT_RAW_SOURCE_AUDIT.txt').write_text(audit, encoding='utf-8')
          print(f'Generated audit: {len(audit)} bytes across {len(files)} files')
          PY

      - name: Validate generated audit
        shell: bash
        run: |
          set -euo pipefail
          test -s BOT_RAW_SOURCE_AUDIT.txt
          test "$(wc -c < BOT_RAW_SOURCE_AUDIT.txt)" -ge 500
          grep -q '^FILE INVENTORY$' BOT_RAW_SOURCE_AUDIT.txt
          grep -q '^FILE: ' BOT_RAW_SOURCE_AUDIT.txt
          echo "Audit validation passed: $(wc -c < BOT_RAW_SOURCE_AUDIT.txt) bytes"

      - name: Persist audit through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          path = 'BOT_RAW_SOURCE_AUDIT.txt'
          api_url = f'https://api.github.com/repos/{repo}/contents/{path}'
          content = base64.b64encode(open(path, 'rb').read()).decode('ascii')

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'stockmarket-bot-source-audit',
          }

          for attempt in range(1, 6):
              current_sha = None
              try:
                  request = urllib.request.Request(api_url, headers=headers, method='GET')
                  with urllib.request.urlopen(request, timeout=30) as response:
                      current = json.load(response)
                  current_sha = current.get('sha')
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

              payload = {
                  'message': 'chore: refresh complete raw source audit',
                  'content': content,
              }
              if current_sha:
                  payload['sha'] = current_sha

              body = json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(api_url, data=body, headers=headers, method='PUT')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
                  commit_sha = result.get('commit', {}).get('sha', '') if isinstance(result, dict) else ''
                  print(f'Audit persisted successfully on attempt {attempt}. Commit={commit_sha[:12]}')
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')[:500]
                  print(f'Audit persistence attempt {attempt} failed with HTTP {exc.code}: {detail}')
                  if attempt == 5:
                      raise
                  time.sleep(attempt * 2)
          else:
              raise SystemExit('Unable to persist complete source audit after 5 attempts.')
          PY
