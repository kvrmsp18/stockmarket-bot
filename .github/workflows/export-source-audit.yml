name: Export Bot Source Audit

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build complete raw source TXT
        shell: bash
        run: |
          set -euo pipefail
          out="BOT_RAW_SOURCE_AUDIT.txt"
          : > "$out"
          echo "STOCKMARKET-BOT RAW SOURCE AUDIT" >> "$out"
          echo "Repository: kvrmsp18/stockmarket-bot" >> "$out"
          echo "Branch: main" >> "$out"
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"
          echo "" >> "$out"
          echo "This file contains repository text/source files relevant to bot construction and diagnosis." >> "$out"
          echo "Secrets and credentials are intentionally excluded. Binary/generated market database files are excluded." >> "$out"
          echo "" >> "$out"
          while IFS= read -r -d '' f; do
            case "$f" in
              ./BOT_RAW_SOURCE_AUDIT.txt) continue ;;
              ./.git/*) continue ;;
              ./data/trading.db|./data/universe.json) continue ;;
            esac
            printf '\n\n============================================================\nFILE: %s\n============================================================\n\n' "${f#./}" >> "$out"
            cat "$f" >> "$out"
          done < <(find . -type f -print0 | sort -z)

      - name: Upload raw TXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-raw-source-audit
          path: BOT_RAW_SOURCE_AUDIT.txt
          if-no-files-found: error
