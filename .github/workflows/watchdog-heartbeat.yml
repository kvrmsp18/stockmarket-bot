name: Heartbeat Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: heartbeat-watchdog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Persist watchdog heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64,json,os,socket,time,urllib.error,urllib.request; from datetime import datetime; from zoneinfo import ZoneInfo; repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]; path="data/watchdog_heartbeat.json"; url=f"https://api.github.com/repos/{repo}/contents/{path}"; headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"stockmarket-bot-heartbeat"}; now=datetime.now(ZoneInfo("Asia/Kolkata")); payload={"state":"RUNNING","message":"GitHub Actions heartbeat watchdog is active","updated_at":now.isoformat(),"source":"github-actions-heartbeat-watchdog","hostname":socket.gethostname(),"workflow_run_id":os.environ.get("GITHUB_RUN_ID"),"event":os.environ.get("GITHUB_EVENT_NAME"),"heartbeat_interval_seconds":300,"is_persistent_worker":False,"paper_mode":True,"live_order_submission":False,"note":"Independent watchdog heartbeat; it does not represent a successful market cycle."}; encoded=base64.b64encode(json.dumps(payload,indent=2,ensure_ascii=False).encode()).decode();\nfor attempt in range(1,6):\n  try:\n    req=urllib.request.Request(url,headers=headers,method="GET")\n    try:\n      with urllib.request.urlopen(req,timeout=15) as r: current=json.load(r)\n      current_sha=current.get("sha","")\n    except urllib.error.HTTPError as e:\n      if e.code==404: current_sha=""\n      else: raise\n    body={"message":"Update independent watchdog heartbeat [skip ci]","content":encoded};\n    if current_sha: body["sha"]=current_sha\n    put=urllib.request.Request(url,data=json.dumps(body).encode(),headers={**headers,"Content-Type":"application/json"},method="PUT")\n    with urllib.request.urlopen(put,timeout=15) as r: result=json.load(r)\n    print("Watchdog heartbeat persisted successfully on attempt",attempt,"Commit:",result.get("commit",{}).get("sha","")); print("Heartbeat timestamp:",payload["updated_at"]); raise SystemExit(0)\n  except (urllib.error.HTTPError,urllib.error.URLError) as e:\n    detail=e.read().decode("utf-8",errors="replace")[:500] if isinstance(e,urllib.error.HTTPError) else str(e); print("Attempt",attempt,"failed:",detail);\n    if isinstance(e,urllib.error.HTTPError) and e.code not in {409,422,429,500,502,503,504}: raise\n    if attempt==5: raise\n    time.sleep(2*attempt)\nraise SystemExit("Unable to persist watchdog heartbeat after 5 attempts.")'