name: Heartbeat Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: heartbeat-watchdog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Write watchdog heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,os,socket; from datetime import datetime; from pathlib import Path; from zoneinfo import ZoneInfo; p=Path("data/watchdog_heartbeat.json"); p.parent.mkdir(parents=True,exist_ok=True); n=datetime.now(ZoneInfo("Asia/Kolkata")); payload={"state":"RUNNING","message":"GitHub Actions heartbeat watchdog is active","updated_at":n.isoformat(),"source":"github-actions-heartbeat-watchdog","hostname":socket.gethostname(),"workflow_run_id":os.getenv("GITHUB_RUN_ID"),"event":os.getenv("GITHUB_EVENT_NAME"),"heartbeat_interval_seconds":300,"is_persistent_worker":False,"paper_mode":True,"live_order_submission":False,"note":"Independent watchdog heartbeat; it does not represent a successful market cycle."}; p.write_text(json.dumps(payload,indent=2),encoding="utf-8")'

      - name: Persist watchdog heartbeat
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stockmarket-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python -c 'import json,os,socket; from datetime import datetime; from pathlib import Path; from zoneinfo import ZoneInfo; p=Path("data/watchdog_heartbeat.json"); p.parent.mkdir(parents=True,exist_ok=True); n=datetime.now(ZoneInfo("Asia/Kolkata")); payload={"state":"RUNNING","message":"GitHub Actions heartbeat watchdog is active","updated_at":n.isoformat(),"source":"github-actions-heartbeat-watchdog","hostname":socket.gethostname(),"workflow_run_id":os.getenv("GITHUB_RUN_ID"),"event":os.getenv("GITHUB_EVENT_NAME"),"heartbeat_interval_seconds":300,"is_persistent_worker":False,"paper_mode":True,"live_order_submission":False,"note":"Independent watchdog heartbeat; it does not represent a successful market cycle."}; p.write_text(json.dumps(payload,indent=2),encoding="utf-8")'
            git add data/watchdog_heartbeat.json
            git commit -m 'Update independent watchdog heartbeat [skip ci]' || true
            if git push origin HEAD:main; then
              echo "Watchdog heartbeat persisted on attempt ${attempt}."
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying."
            sleep 2
          done
          echo 'Unable to persist watchdog heartbeat after 5 attempts.'
          exit 1
