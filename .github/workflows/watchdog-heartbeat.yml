name: Heartbeat Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: heartbeat-watchdog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Persist watchdog heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          path="data/watchdog_heartbeat.json"
          now="$(TZ=Asia/Kolkata date --iso-8601=seconds)"

          payload="$(jq -n \
            --arg state "RUNNING" \
            --arg message "GitHub Actions heartbeat watchdog is active" \
            --arg updated_at "$now" \
            --arg source "github-actions-heartbeat-watchdog" \
            --arg hostname "$(hostname)" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{state:$state,message:$message,updated_at:$updated_at,source:$source,hostname:$hostname,workflow_run_id:$workflow_run_id,event:$event,heartbeat_interval_seconds:300,is_persistent_worker:false,paper_mode:true,live_order_submission:false,note:"Independent watchdog heartbeat; it does not represent a successful market cycle."}')"

          encoded="$(printf '%s' "$payload" | base64 -w0)"

          for attempt in 1 2 3 4 5; do
            sha=""
            if current="$(gh api "repos/$repo/contents/$path" 2>/dev/null)"; then
              sha="$(printf '%s' "$current" | jq -r '.sha // empty')"
            fi

            if [ -n "$sha" ]; then
              if gh api --method PUT "repos/$repo/contents/$path" \
                -f message='Update independent watchdog heartbeat [skip ci]' \
                -f content="$encoded" \
                -f sha="$sha" >/dev/null; then
                echo "Watchdog heartbeat persisted successfully on attempt $attempt"
                echo "Heartbeat timestamp: $now"
                exit 0
              fi
            else
              if gh api --method PUT "repos/$repo/contents/$path" \
                -f message='Create independent watchdog heartbeat [skip ci]' \
                -f content="$encoded" >/dev/null; then
                echo "Watchdog heartbeat created successfully on attempt $attempt"
                echo "Heartbeat timestamp: $now"
                exit 0
              fi
            fi

            echo "Attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to persist watchdog heartbeat after 5 attempts."
          exit 1
