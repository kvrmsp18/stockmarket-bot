name: Monitor Scheduler Guard

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-scheduler-guard.yml'
  workflow_dispatch: {}

concurrency:
  group: monitor-scheduler-guard
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ensure complete monitor is dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # The guard intentionally triggers on this workflow's own push so a
          # repaired monitor workflow can be validated immediately.
          workflow='.github/workflows/continuous-monitor.yml'
          now_epoch="$(date +%s)"
          latest="$(gh run list --repo "$REPO" --workflow "$workflow" --limit 1 --json status,conclusion,createdAt,databaseId --jq '.[0] // empty')"

          if [ -z "$latest" ]; then
            echo 'No Complete Intraday Monitor run exists; dispatching one.'
            gh workflow run "$workflow" --repo "$REPO" --ref main
            exit 0
          fi

          status="$(printf '%s' "$latest" | jq -r '.status')"
          conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // empty')"
          created_at="$(printf '%s' "$latest" | jq -r '.createdAt')"
          created_epoch="$(date -d "$created_at" +%s)"
          age=$((now_epoch - created_epoch))
          run_id="$(printf '%s' "$latest" | jq -r '.databaseId')"

          echo "Latest monitor status=$status conclusion=$conclusion age_seconds=$age run_id=$run_id"

          if [ "$status" = 'queued' ] || [ "$status" = 'in_progress' ]; then
            echo 'Complete monitor is already active; no dispatch needed.'
            exit 0
          fi

          if [ "$conclusion" = 'failure' ]; then
            echo 'Latest monitor run failed; dispatching a replacement run.'
            gh workflow run "$workflow" --repo "$REPO" --ref main
            exit 0
          fi

          if [ "$age" -lt 390 ]; then
            echo 'A recent successful monitor run exists; no dispatch needed.'
            exit 0

          fi

          echo 'Monitor is stale; dispatching a replacement run.'
          gh workflow run "$workflow" --repo "$REPO" --ref main
